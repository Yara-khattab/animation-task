<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <script>
            function append(btn){
var x=btn.parentElement.querySelector('.copiedlabel')
x.classList.remove("d-none");
 setTimeout(()=>{
    x.classList.add("d-none");
 },2000);
                
var copyButtons = document.querySelectorAll(".copyBtn");
copyButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
        var copiedLabel = btn.nextElementSibling;
        copiedLabel.classList.remove("d-none");
        setTimeout(function () {
            copiedLabel.classList.add("d-none");
        }, 2000);
    });
});
}
        </script>
    </head>
    <body>
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
        <div class="div6"></div>
        <div class="div7"></div>
    </body>

</html>
